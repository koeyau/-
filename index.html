<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星際探險家：小數乘法大冒險</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
    .font-fun {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    /* Ambient Space Animations */
    @keyframes floating {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), inset 0 0 15px rgba(56, 189, 248, 0.1); }
      50% { box-shadow: 0 0 35px rgba(139, 92, 246, 0.6), inset 0 0 25px rgba(56, 189, 248, 0.25); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes bounceSuccess {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .animate-float {
      animation: floating 3.5s ease-in-out infinite;
    }
    .glow-panel {
      animation: pulseGlow 4s infinite ease-in-out;
    }
    .animate-shake {
      animation: shakeWrong 0.4s ease-in-out;
    }
    .animate-pop {
      animation: bounceSuccess 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Star Canvas */
    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 overflow-x-hidden relative selection:bg-purple-500 selection:text-white">

  <!-- Background Space Canvas -->
  <canvas id="space-canvas"></canvas>

  <!-- Interactive Game Box Container -->
  <main class="relative z-10 w-full max-w-xl bg-slate-900/85 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-5 sm:p-8 shadow-2xl glow-panel transition-all duration-300">
    
    <!-- Top Bar: Status & Collected Stars -->
    <header class="flex items-center justify-between border-b border-slate-700/60 pb-4 mb-5">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-cyan-400 flex items-center justify-center text-2xl shadow-lg shadow-purple-500/30 animate-float">
          🚀
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-cyan-300 via-sky-200 to-purple-300 bg-clip-text text-transparent">
            星際探險導航號
          </h1>
          <p class="text-xs text-purple-200/70 font-medium">小五數學：小數乘法能量任務</p>
        </div>
      </div>

      <!-- Energy Star Medals Indicator -->
      <div class="flex flex-col items-end gap-1 bg-slate-800/80 px-3.5 py-1.5 rounded-2xl border border-yellow-500/25">
        <span class="text-[11px] font-medium text-amber-300/90 tracking-wider">🌟 收集星章</span>
        <div class="flex items-center gap-1.5" id="stars-row">
          <span id="star-badge-0" class="text-xl opacity-30 transition-all duration-300 transform">⭐</span>
          <span id="star-badge-1" class="text-xl opacity-30 transition-all duration-300 transform">⭐</span>
          <span id="star-badge-2" class="text-xl opacity-30 transition-all duration-300 transform">⭐</span>
        </div>
      </div>
    </header>

    <!-- Sub-bar: Mission Level & Retry Indicator -->
    <div class="flex items-center justify-between text-xs font-semibold mb-3">
      <span id="level-badge" class="px-3 py-1 rounded-full bg-purple-950/80 border border-purple-500/40 text-purple-200 flex items-center gap-1.5 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        關卡 1 / 3：星際雷達估算
      </span>
      <span id="retry-counter" class="text-slate-400 font-normal hidden bg-slate-800/80 px-2.5 py-0.5 rounded-full border border-slate-700 text-[11px]">
        💬 導航員：再試一次，你一定可以！
      </span>
    </div>

    <!-- Active Question Card Section -->
    <section id="question-panel" class="transition-all duration-300">
      <!-- Question Prompt Box -->
      <div class="bg-gradient-to-b from-slate-800/90 to-slate-850/90 border border-slate-700/80 rounded-2xl p-4 sm:p-5 mb-5 shadow-inner">
        <div class="flex items-start gap-2.5 mb-2">
          <span class="text-cyan-400 text-sm font-bold tracking-wider">📡 任務指引：</span>
        </div>
        <p id="question-text" class="text-base sm:text-lg leading-relaxed text-slate-100 font-medium">
          載入飛行日誌中...
        </p>
      </div>

      <!-- Multiple-Choice 4 Options Container -->
      <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
        <!-- 4 choice buttons will be generated by JavaScript -->
      </div>
    </section>

    <!-- Dynamic Feedback Banner (Correct / Incorrect Hint) -->
    <section id="feedback-panel" class="hidden mb-5 rounded-2xl p-4 sm:p-5 border transition-all duration-300">
      <div class="flex items-start gap-3">
        <div id="feedback-icon" class="text-3xl shrink-0">✨</div>
        <div class="flex-1">
          <h2 id="feedback-title" class="font-bold text-base mb-1"></h2>
          <div id="feedback-body" class="text-sm leading-relaxed"></div>
        </div>
      </div>
    </section>

    <!-- Interactive Navigation Actions -->
    <div id="action-wrapper" class="flex items-center justify-between pt-1">
      <p id="helper-status" class="text-xs text-slate-400 italic">點選一個最合適的答案吧！</p>
      
      <!-- Next Question Button -->
      <button id="next-button" class="hidden px-6 py-2.5 rounded-xl font-bold bg-gradient-to-r from-cyan-500 via-sky-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white shadow-lg shadow-cyan-500/30 transition active:scale-95 flex items-center gap-2">
        <span id="next-button-label">前進下一關 🛸</span>
      </button>
    </div>

    <!-- Victory Screen (Shown only when all 3 questions pass) -->
    <section id="victory-panel" class="hidden text-center py-6">
      <div class="w-20 h-20 mx-auto mb-4 rounded-3xl bg-gradient-to-tr from-amber-400 to-yellow-200 flex items-center justify-center text-5xl shadow-xl shadow-yellow-500/30 animate-bounce">
        🏆
      </div>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-200 to-orange-300 mb-2">
        全數答對！星際大通關！
      </h2>
      <p class="text-slate-300 text-sm sm:text-base max-w-md mx-auto leading-relaxed mb-6">
        太優秀了，小小星際探險家！🌟 你成功精通了「小數乘整數」、「快速估算」和「小數點精確定位」。星艦已注滿超光速推進能量，準備航向更廣闊的銀河！
      </p>

      <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 mb-6 max-w-sm mx-auto flex items-center justify-around">
        <div class="text-center">
          <p class="text-xs text-slate-400">總任務數</p>
          <p class="text-xl font-bold text-cyan-300 font-fun">3 / 3</p>
        </div>
        <div class="w-px h-8 bg-slate-700"></div>
        <div class="text-center">
          <p class="text-xs text-slate-400">榮獲星章</p>
          <p class="text-xl font-bold text-yellow-300 font-fun">3 ⭐</p>
        </div>
        <div class="w-px h-8 bg-slate-700"></div>
        <div class="text-center">
          <p class="text-xs text-slate-400">探險家位階</p>
          <p class="text-xl font-bold text-purple-300 font-fun">王牌領航員</p>
        </div>
      </div>

      <button id="restart-button" class="px-7 py-3 rounded-2xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 text-white shadow-lg shadow-purple-500/35 transition active:scale-95 flex items-center gap-2 mx-auto">
        <span>🔄 重新啟動星際冒險</span>
      </button>
    </section>

  </main>

  <script>
    /* Question Data with Space Theme & Primary 5 Decimals Focus */
    const quizData = [
      {
        id: 1,
        title: "關卡 1 / 3：星際雷達估算",
        question: "探險家注意！前方有一片神祕隕石帶，每圈通道長約 4.9 公里。如果飛船需要連續繞行巡航 7 圈，請運用「估算」方法，估計總共大約要飛行多少公里？",
        options: [
          { key: "A", text: "大約 28 公里", correct: false },
          { key: "B", text: "大約 35 公里", correct: true },
          { key: "C", text: "大約 49 公里", correct: false },
          { key: "D", text: "大約 70 公里", correct: false }
        ],
        hint: "💡 導航員溫馨提示：<br>想一想，4.9 最接近哪個整數呢？<br>沒錯，就是 5！把 4.9 估成 5，再來算算看 5 × 7 是多少？試試看吧！",
        explanation: "🌟 答得太精彩了！獲得第一顆星章！<br><strong>思路解析：</strong>4.9 公里非常接近整數 5。我們利用 5 × 7 = 35，就能迅速估算出大約飛行 35 公里（實際精確值是 34.3 公里）。估算在星際航行中能幫我們迅速判斷能量夠不夠用哦！"
      },
      {
        id: 2,
        title: "關卡 2 / 3：小數點座標定位",
        question: "飛船電腦回傳一組重要的軌道密碼：已知基礎整數相乘 16 × 25 = 400。現在我們要計算小數乘法：1.6 × 25，請問結果的小數點位置在哪裡？數值是多少？",
        options: [
          { key: "A", text: "4", correct: false },
          { key: "B", text: "40", correct: true },
          { key: "C", text: "400", correct: false },
          { key: "D", text: "0.4", correct: false }
        ],
        hint: "💡 導航員溫馨提示：<br>算式裡 1.6 是「一位小數」，25 是整數。<br>積的小數點從右邊往左邊數，應該點在哪裡呢？記得末尾如果是 0 可以進行化簡喔！",
        explanation: "🌟 太神準了！第二顆星章入手！<br><strong>思路解析：</strong>1.6 只有一位小數，所以先算整數 16 × 25 = 400。再從右邊數 1 位點上小數點，得到 40.0。依據小數的性質，末尾的 0 可以化簡省略，因此結果就是 40！"
      },
      {
        id: 3,
        title: "關卡 3 / 3：推進晶體重量計算",
        question: "終極躍遷需要填裝「星光能量晶體」！每顆晶體重 0.45 公斤，小探險家總共需要裝載 6 顆，請問這 6 顆晶體一共重多少公斤？",
        options: [
          { key: "A", text: "2.7 公斤", correct: true },
          { key: "B", text: "27 公斤", correct: false },
          { key: "C", text: "0.27 公斤", correct: false },
          { key: "D", text: "2.4 公斤", correct: false }
        ],
        hint: "💡 導航員溫馨提示：<br>第一步：先算整數 45 × 6 = 270。<br>第二步：因為 0.45 是「兩位小數」，從 270 右邊向左數 2 位點上小數點，最後別忘了末尾的 0 喔！",
        explanation: "🌟 完美的星際計算！獲得第三顆星章！<br><strong>思路解析：</strong>先按整數乘法算出 45 × 6 = 270。因被乘數 0.45 有兩位小數，所以向左點兩位變成 2.70，化簡去掉末尾的 0 即為 2.7 公斤！"
      }
    ];

    // State
    let currentIndex = 0;
    let earnedStars = [false, false, false];
    let isCurrentQuestionAnsweredCorrectly = false;

    // DOM Elements
    const questionPanel = document.getElementById('question-panel');
    const questionText = document.getElementById('question-text');
    const optionsGrid = document.getElementById('options-grid');
    const levelBadge = document.getElementById('level-badge');
    const retryCounter = document.getElementById('retry-counter');
    const feedbackPanel = document.getElementById('feedback-panel');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackBody = document.getElementById('feedback-body');
    const helperStatus = document.getElementById('helper-status');
    const nextButton = document.getElementById('next-button');
    const nextButtonLabel = document.getElementById('next-button-label');
    const victoryPanel = document.getElementById('victory-panel');
    const actionWrapper = document.getElementById('action-wrapper');
    const restartButton = document.getElementById('restart-button');

    // Update Star Badges UI
    function updateStarIcons() {
      for (let i = 0; i < 3; i++) {
        const starEl = document.getElementById(`star-badge-${i}`);
        if (earnedStars[i]) {
          starEl.classList.remove('opacity-30');
          starEl.classList.add('opacity-100', 'scale-125');
        } else {
          starEl.classList.remove('opacity-100', 'scale-125');
          starEl.classList.add('opacity-30');
        }
      }
    }

    // Render current question
    function loadQuestion(index) {
      const q = quizData[index];
      isCurrentQuestionAnsweredCorrectly = false;

      // Update Header Badges
      levelBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> ${q.title}`;
      retryCounter.classList.add('hidden');
      helperStatus.textContent = "請思考後，點選最合適的答案！";
      
      // Hide feedback & Next button
      feedbackPanel.classList.add('hidden');
      nextButton.classList.add('hidden');

      // Question Text
      questionText.innerHTML = q.question;

      // Create 4 Options
      optionsGrid.innerHTML = '';
      q.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = "w-full text-left p-4 rounded-2xl border border-slate-700/80 bg-slate-800/60 hover:bg-slate-750 hover:border-purple-400/80 text-slate-100 font-medium transition-all duration-200 active:scale-98 flex items-center justify-between group shadow-sm";
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-xl bg-purple-900/60 border border-purple-500/40 text-purple-200 flex items-center justify-center font-bold text-sm group-hover:bg-purple-600 group-hover:text-white transition-colors">
              ${opt.key}
            </span>
            <span class="text-sm sm:text-base">${opt.text}</span>
          </div>
          <span class="text-xs text-purple-300 opacity-0 group-hover:opacity-100 transition-opacity">選擇 ➔</span>
        `;
        btn.onclick = () => onSelectOption(opt, btn);
        optionsGrid.appendChild(btn);
      });
    }

    // Handle Option Selection
    function onSelectOption(selectedOpt, btnElement) {
      const q = quizData[currentIndex];

      if (selectedOpt.correct) {
        // --- CORRECT ANSWER ---
        isCurrentQuestionAnsweredCorrectly = true;
        earnedStars[currentIndex] = true;
        updateStarIcons();

        // Style the clicked button
        btnElement.classList.remove('border-slate-700/80', 'bg-slate-800/60');
        btnElement.classList.add('border-emerald-400', 'bg-emerald-950/70', 'animate-pop');

        // Disable all option buttons
        const allButtons = optionsGrid.querySelectorAll('button');
        allButtons.forEach(b => {
          b.disabled = true;
          b.classList.remove('hover:bg-slate-750', 'hover:border-purple-400/80');
        });

        // Feedback Panel
        feedbackPanel.className = "mb-5 rounded-2xl p-4 sm:p-5 border transition-all duration-300 bg-emerald-950/70 border-emerald-500/60 text-emerald-100";
        feedbackIcon.textContent = "⭐";
        feedbackTitle.textContent = "太厲害了！完全正確！";
        feedbackBody.innerHTML = q.explanation;
        feedbackPanel.classList.remove('hidden');

        // Show Next / Finish Button
        helperStatus.textContent = "太棒了，準備好迎接下一個星系了嗎？";
        nextButton.classList.remove('hidden');
        if (currentIndex === quizData.length - 1) {
          nextButtonLabel.textContent = "領取星際通關勳章 🏆";
        } else {
          nextButtonLabel.textContent = "前往下一關 🛸";
        }

      } else {
        // --- INCORRECT ANSWER (Allow retry) ---
        btnElement.classList.add('animate-shake', 'border-rose-500/80', 'bg-rose-950/30', 'opacity-70');
        btnElement.disabled = true;

        // Feedback Panel with Hint
        feedbackPanel.className = "mb-5 rounded-2xl p-4 sm:p-5 border transition-all duration-300 bg-amber-950/70 border-amber-500/60 text-amber-100";
        feedbackIcon.textContent = "🛸";
        feedbackTitle.textContent = "差一點點！星艦雷達給出了思路提示：";
        feedbackBody.innerHTML = q.hint;
        feedbackPanel.classList.remove('hidden');

        retryCounter.classList.remove('hidden');
        helperStatus.textContent = "別氣餒，看看提示再試試其他選項！";
      }
    }

    // Next Question Button Click
    nextButton.onclick = () => {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
      } else {
        // All 3 questions complete!
        questionPanel.classList.add('hidden');
        feedbackPanel.classList.add('hidden');
        actionWrapper.classList.add('hidden');
        retryCounter.classList.add('hidden');
        levelBadge.innerHTML = "✨ 星際探險任務圓滿達成！";
        victoryPanel.classList.remove('hidden');
      }
    };

    // Restart Adventure
    restartButton.onclick = () => {
      currentIndex = 0;
      earnedStars = [false, false, false];
      updateStarIcons();
      victoryPanel.classList.add('hidden');
      questionPanel.classList.remove('hidden');
      actionWrapper.classList.remove('hidden');
      loadQuestion(currentIndex);
    };

    // Dynamic Starfield Canvas Background Animation
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const numStars = 90;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.5,
          color: Math.random() > 0.3 ? '#e0e7ff' : '#a855f7',
          speed: Math.random() * 0.3 + 0.1,
          alpha: Math.random() * 0.8 + 0.2
        });
      }
    }

    function drawSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.globalAlpha = star.alpha;
        ctx.fill();

        // Slow parallax drift
        star.y -= star.speed;
        if (star.y < 0) {
          star.y = canvas.height;
          star.x = Math.random() * canvas.width;
        }
      });
      ctx.globalAlpha = 1.0;
      requestAnimationFrame(drawSpace);
    }

    window.addEventListener('resize', resizeCanvas);

    // Initial Launch
    window.onload = function() {
      resizeCanvas();
      drawSpace();
      loadQuestion(currentIndex);
    };
  </script>
</body>
</html>
